<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; max-width: 700px; margin: 2rem auto;">
  <h2>Transcription test</h2>
  <input type="file" id="f" accept="video/*,audio/*">
  <select id="lang">
    <option value="eng">English</option>
    <option value="yor">Yoruba</option>
    <option value="ibo">Igbo</option>
    <option value="hau">Hausa</option>
    <option value="pcm">Pidgin</option>
  </select>
  <button onclick="go()">Transcribe</button>
  <pre id="out"></pre>
  <script>
    async function go() {
      const out = document.getElementById("out");
      const file = document.getElementById("f").files[0];
      if (!file) { out.textContent = "Choose a file first."; return; }
      out.textContent = "Working... this can take a few minutes.";
      const form = new FormData();
      form.append("file", file);
      form.append("language", document.getElementById("lang").value);
      const res = await fetch("/api/transcribe", { method: "POST", body: form });
      if (!res.ok) { out.textContent = "Error: " + res.status; return; }
      const segs = await res.json();
      out.textContent = segs.map(s => `[${s.start}s - ${s.end}s] ${s.text}`).join("\n");
    }
  </script>
</body>
</html>
